name: Auto Tag

on:
  push:
    branches: [ main ]

permissions:
  contents: write

# Two merges close together otherwise both read the same "latest tag" and both
# compute the same next version — so one run fails on a duplicate tag, or the
# versions land out of order. Never cancel a half-created tag.
concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the action can find the previous tag

      - name: Create tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          # Deploy runs on push to main (deploy.yml), so this tag is a version
          # record only and does not need to trigger anything — GITHUB_TOKEN is fine.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch          # feat: -> minor, BREAKING CHANGE -> major
          tag_prefix: v
