name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Dockerfile.web'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  id-token: write   # required for WIF

jobs:
  deploy:
    name: Build & deploy incomatic-web to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        id: tags
        run: |
          echo "web_image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/incomatic-web:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push web image
        run: |
          docker build --platform=linux/amd64 -f Dockerfile.web \
            -t ${{ steps.tags.outputs.web_image }} .
          docker push ${{ steps.tags.outputs.web_image }}

      - name: Deploy incomatic-web
        run: |
          gcloud run deploy incomatic-web \
            --image=${{ steps.tags.outputs.web_image }} \
            --region=${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --port=8080 --memory=256Mi --cpu=1

      - name: Smoke test
        run: |
          WEB_URL=$(gcloud run services describe incomatic-web --region=${{ vars.GCP_REGION }} --format='value(status.url)')
          curl -fsS ${WEB_URL}/ > /dev/null
