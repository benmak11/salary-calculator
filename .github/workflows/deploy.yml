name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for WIF

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tags
        id: tags
        run: |
          BASE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}
          echo "api_image=${BASE}/api:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "rp_image=${BASE}/rule-pack-service:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push api image
        run: |
          docker build --platform=linux/amd64 -f Dockerfile \
            -t ${{ steps.tags.outputs.api_image }} .
          docker push ${{ steps.tags.outputs.api_image }}

      - name: Build & push rule-pack-service image
        run: |
          docker build --platform=linux/amd64 -f Dockerfile.rule-pack-service \
            -t ${{ steps.tags.outputs.rp_image }} .
          docker push ${{ steps.tags.outputs.rp_image }}

      - name: Deploy rule-pack-service
        run: |
          gcloud run deploy rule-pack-service \
            --image=${{ steps.tags.outputs.rp_image }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.RP_SA }} \
            --ingress=all \
            --no-allow-unauthenticated \
            --port=8081 --memory=512Mi --cpu=1 \
            --set-env-vars=ENABLE_GCP=true,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_BUCKET_RULEPACKS=${{ vars.GCP_BUCKET_RULEPACKS }},PUBSUB_TOPIC=${{ vars.PUBSUB_TOPIC}},SERVER_PORT=8081

      - name: Deploy api
        run: |
          RP_URL=$(gcloud run services describe rule-pack-service --region=${{ vars.GCP_REGION }} --format='value(status.url)')
          gcloud run deploy salary-calculator-api \
            --image=${{ steps.tags.outputs.api_image }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.API_SA }} \
            --allow-unauthenticated \
            --port=8080 --memory=512Mi --cpu=1 \
            --set-env-vars=RULE_PACK_SERVICE_URL=$RP_URL,RULE_PACK_AUDIENCE=$RP_URL,SERVER_PORT=8080,ENABLE_GCP=true,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},APPLE_AUDIENCE=com.makusha.incomatic \
            --update-secrets=SESSION_JWT_SECRET=salary-calculator-api-session-jwt-secret:latest

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe salary-calculator-api --region=${{ vars.GCP_REGION }} --format='value(status.url)')
          curl -fsS ${API_URL}/actuator/health
