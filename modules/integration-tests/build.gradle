plugins {
    id 'java'
}

dependencies {
    testImplementation project(':modules:common')
    testImplementation project(':modules:calculator')
    testImplementation project(':modules:rules-registry')
    testImplementation project(':modules:api')

    // Javalin's JavalinTest helper for HTTP-driven endpoint tests
    testImplementation 'io.javalin:javalin:6.3.0'
    testImplementation 'io.javalin:javalin-testtools:6.3.0'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

test {
    useJUnitPlatform()
}
