# Spring Application
spring.application.name=rule-pack-service
server.port=8081

# Google Cloud
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:salary-calculator-dev}
gcp.storage.bucket.rulepacks=${GCP_BUCKET_RULEPACKS:salary-calculator-rulepacks}

# Pub/Sub
gcp.pubsub.topic.rulepack-lifecycle=${PUBSUB_TOPIC:rule-pack-lifecycle}

# Cache Configuration (Redis / Cloud Memorystore)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.app.salary.rulepack=INFO
logging.level.com.google.cloud.storage=WARN
