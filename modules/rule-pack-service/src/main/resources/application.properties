# Spring Application
spring.application.name=rule-pack-service
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/salary_calculator
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Google Cloud Storage
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:salary-calculator-dev}
gcp.storage.bucket.rulepacks=${GCP_BUCKET_RULEPACKS:salary-calculator-rulepacks}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# Logging
logging.level.app.salary.rulepack=INFO
logging.level.com.google.cloud.storage=WARN
