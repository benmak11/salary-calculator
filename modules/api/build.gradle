plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

dependencies {
    implementation project(':modules:calculator')
    implementation project(':modules:common')
    implementation project(':modules:rules-registry')

    // Javalin (lightweight web framework, replaces Spring Boot)
    implementation 'io.javalin:javalin:7.2.0'
    implementation 'io.javalin:javalin-micrometer:7.2.0'

    // JSON
    // jackson-databind version comes from modules:common's `api` dependency (2.21.3) —
    // don't pin it here, it would just be a stale duplicate of that pin.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

    // Validation (Hibernate Validator provides the Jakarta Validation runtime)
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.glassfish.expressly:expressly:5.0.0'

    // Metrics (Prometheus scrape endpoint)
    implementation 'io.micrometer:micrometer-registry-prometheus:1.13.4'

    // Google ID tokens for service-to-service auth on Cloud Run
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.48.0'

    // GCP clients — Firestore for managed-account calculation history.
    // Same libraries-bom version as rule-pack-service to keep transitive
    // versions aligned across the two services.
    implementation platform('com.google.cloud:libraries-bom:26.83.0')
    implementation 'com.google.cloud:google-cloud-firestore'

    // Gemini (Vertex AI mode, ADC auth) for AI-generated budget plans.
    implementation 'com.google.genai:google-genai:1.63.0'

    // JWT mint/verify for our own session tokens + Apple identity-token verification.
    // jwks-rsa provides the cached RSA-key fetcher used to verify Apple tokens.
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'com.auth0:jwks-rsa:0.22.1'

    // Client-side rule-pack cache inside HttpRulePackClient.
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Logging
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.13'
    runtimeOnly 'org.slf4j:jul-to-slf4j:2.0.13'
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:8.0'
    runtimeOnly 'org.codehaus.janino:janino:3.1.12'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
    testImplementation 'io.javalin:javalin-testtools:7.2.0'
}

application {
    mainClass = 'app.salary.api.Main'
}

shadowJar {
    archiveBaseName = 'salary-calculator-api'
    archiveClassifier = 'all'
    archiveVersion = '1.0.0'
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'app.salary.api.Main'
    }
}

test {
    useJUnitPlatform()
}
