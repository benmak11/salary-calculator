plugins {
    id 'java-library'
}

dependencies {
    // Lombok (CalculationInput getters/setters)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation project(':modules:common')
    implementation project(':modules:rules-registry')
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // Phase timers in CalculationOrchestrator. `api` scope because MeterRegistry
    // appears in the orchestrator's constructor signature.
    api 'io.micrometer:micrometer-core:1.13.4'
}
