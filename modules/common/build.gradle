plugins {
    id 'java-library'
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'
    api 'org.slf4j:slf4j-api:2.0.13'
    api 'jakarta.validation:jakarta.validation-api:3.0.2'
    // swagger-annotations is a pure annotations jar (no Spring) — kept for OpenAPI documentation hints
    api 'io.swagger.core.v3:swagger-annotations:2.2.22'
}
