plugins {
    id 'java-library'
}

dependencies {
    // Lombok (kept for entity getters/setters/builders)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    api 'com.fasterxml.jackson.core:jackson-databind:2.21.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'
    api 'org.slf4j:slf4j-api:2.0.13'
    api 'jakarta.validation:jakarta.validation-api:3.0.2'
    // swagger-annotations is a pure annotations jar (no Spring) — kept for OpenAPI documentation hints
    api 'io.swagger.core.v3:swagger-annotations:2.2.22'
}
