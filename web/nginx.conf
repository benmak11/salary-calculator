worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Design ships .jsx as inert <script type="text/babel"> — Babel standalone
        # fetches these via XHR/fetch and transpiles client-side, so the browser
        # never executes them as a native script. Explicit MIME type anyway, so
        # nothing downstream (proxies, strict clients) treats them as opaque binary.
        location ~* \.jsx$ {
            default_type application/javascript;
        }

        location = /healthz {
            default_type text/plain;
            return 200 'ok';
        }

        # Clean path for the privacy policy (e.g. App Store Connect's
        # "Privacy Policy URL" field) — serves the same single-page app;
        # an inline script in index.html scrolls to #privacy on load.
        location = /privacy {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
