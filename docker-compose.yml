services:
  salary-calculator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salary-calculator-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      # Point the api at the rule-pack-service inside the compose network.
      # Leave blank to skip remote calls and use the embedded classpath rule pack.
      - RULE_PACK_SERVICE_URL=http://rule-pack-service:8081
      - JAVA_OPTS=-Xmx512m -Xms256m
    depends_on:
      rule-pack-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - salary-calc-network
    labels:
      - "com.salary-calculator.description=Salary Calculator API (Javalin)"
      - "com.salary-calculator.version=1.0.0"

  rule-pack-service:
    build:
      context: .
      dockerfile: Dockerfile.rule-pack-service
    container_name: rule-pack-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      # ENABLE_GCP=false boots the service without Firestore/GCS/Pub/Sub. The api
      # will then transparently fall back to its embedded classpath rule pack. Set
      # to true (plus mount credentials and set GOOGLE_APPLICATION_CREDENTIALS)
      # to exercise the real GCP backends.
      - ENABLE_GCP=false
      - GCP_PROJECT_ID=salary-calculator-dev
      - GCP_BUCKET_RULEPACKS=salary-calculator-rulepacks
      - PUBSUB_TOPIC=rule-pack-lifecycle
      - JAVA_OPTS=-Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - salary-calc-network
    labels:
      - "com.salary-calculator.description=Rule Pack Service (Javalin)"
      - "com.salary-calculator.version=1.0.0"

  # ── Optional monitoring stack ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: salary-calc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - salary-calc-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: salary-calc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - salary-calc-network
    profiles:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  salary-calc-network:
    driver: bridge
    name: salary-calc-network

volumes:
  prometheus-data:
    name: salary-calc-prometheus-data
  grafana-data:
    name: salary-calc-grafana-data
